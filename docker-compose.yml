
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      WEB_URL: http://localhost:8080
      API_URL: http://localhost:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SPA_SCANNER_URL: http://spa-scanner:8090
      SPA_SCANNER_TOKEN: ${SPA_SCANNER_TOKEN:-}
      SPA_SCANNER_ENABLED: "false"
      QA_RUNNER_URL: http://qa-runner:8091
      QA_RUNNER_TOKEN: ${QA_RUNNER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - scanner_internal

  spa-scanner:
    profiles: ["scanner"]
    build:
      context: .
      dockerfile: services/spa-scanner/Dockerfile
    restart: always
    environment:
      SCANNER_TOKEN: ${SPA_SCANNER_TOKEN:-}
      SCANNER_ALLOWED_HOSTS: ${SCANNER_ALLOWED_HOSTS:-}
      SCANNER_PROXY_SERVER: http://egress-proxy:3128
      SCANNER_PROXY_USERNAME: ${EGRESS_PROXY_USERNAME:-}
      SCANNER_PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
    depends_on:
      egress-proxy:
        condition: service_started
    networks:
      - scanner_internal
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  qa-runner:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: services/qa-runner/Dockerfile
    restart: always
    environment:
      QA_RUNNER_TOKEN: ${QA_RUNNER_TOKEN:?Set QA_RUNNER_TOKEN in .env}
      QA_PROXY_SERVER: http://egress-proxy:3128
      QA_PROXY_USERNAME: ${EGRESS_PROXY_USERNAME:?Set EGRESS_PROXY_USERNAME in .env}
      QA_PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:?Set EGRESS_PROXY_PASSWORD in .env}
      SCANNER_ALLOWED_HOSTS: ${SCANNER_ALLOWED_HOSTS:?Set SCANNER_ALLOWED_HOSTS in .env}
    depends_on:
      egress-proxy:
        condition: service_started
    networks:
      - scanner_internal
    init: true
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  egress-proxy:
    profiles: ["scanner", "qa"]
    build:
      context: .
      dockerfile: services/egress-proxy/Dockerfile
    restart: always
    environment:
      PROXY_ALLOWED_HOSTS: ${SCANNER_ALLOWED_HOSTS:-}
      PROXY_USERNAME: ${EGRESS_PROXY_USERNAME:-}
      PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
    networks:
      - scanner_internal
      - proxy_egress
    init: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:

networks:
  default:
    driver: bridge
  scanner_internal:
    driver: bridge
    internal: true
  proxy_egress:
    driver: bridge
