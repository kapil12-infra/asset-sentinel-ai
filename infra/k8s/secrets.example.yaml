# Do not commit real values. Create with:
#   kubectl -n <ns> create secret generic sentinel-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... --from-literal=SECRETS_KEY=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:pass@host:5432/sentinel
  JWT_SECRET: change-me
  SECRETS_KEY: 64-hex-chars
  ANTHROPIC_API_KEY: ""
