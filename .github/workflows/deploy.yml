name: Deploy
on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -f infra/docker/api.Dockerfile -t $REGISTRY/asset-sentinel-api:${{ steps.meta.outputs.tag }} .
          docker build -f infra/docker/web.Dockerfile -t $REGISTRY/asset-sentinel-web:${{ steps.meta.outputs.tag }} .
          docker push $REGISTRY/asset-sentinel-api:${{ steps.meta.outputs.tag }}
          docker push $REGISTRY/asset-sentinel-web:${{ steps.meta.outputs.tag }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # develop deploys to STAGE, main deploys to PROD (protect the `prod` environment with required reviewers)
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Roll out
        env:
          NS: ${{ github.ref == 'refs/heads/main' && 'sentinel-prod' || 'sentinel-stage' }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          kubectl -n "$NS" apply -f infra/k8s/
          kubectl -n "$NS" set image deploy/api api=$REGISTRY/asset-sentinel-api:$TAG
          kubectl -n "$NS" set image deploy/web web=$REGISTRY/asset-sentinel-web:$TAG
          kubectl -n "$NS" rollout status deploy/api --timeout=180s
          kubectl -n "$NS" rollout status deploy/web --timeout=180s
